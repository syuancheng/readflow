<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ReadFlow 设置</title>
    <style>
      * { box-sizing: border-box; }
      body { width: 330px; margin: 0; padding: 16px; font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; color: #3c3c3c; }
      h1 { font-size: 16px; font-weight: 800; margin: 0 0 2px; }
      .sub { font-size: 11.5px; color: #999; margin: 0 0 14px; }
      label { display: block; font-size: 11.5px; font-weight: 800; color: #777; margin: 10px 0 4px; }
      input[type="text"], input[type="password"], select { width: 100%; padding: 8px 10px; border: 1.5px solid #e5e5e5; border-radius: 8px; font: inherit; font-size: 12.5px; }
      input:focus, select:focus { outline: none; border-color: #58a700; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
      .row span { font-size: 12px; font-weight: 700; }
      .switch { width: 38px; height: 21px; border-radius: 999px; background: #ccc; position: relative; cursor: pointer; border: 0; flex-shrink: 0; }
      .switch.on { background: #58cc02; }
      .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: transform .15s; }
      .switch.on::after { transform: translateX(17px); }
      button.act { width: 100%; margin-top: 14px; padding: 9px; border: 0; border-radius: 9px; background: #58cc02; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
      button.act.ghost { background: #f7f7f7; color: #3c3c3c; margin-top: 8px; }
      button:disabled { opacity: .6; cursor: default; }
      .status { margin-top: 12px; padding: 9px 11px; border-radius: 8px; background: #f7f7f7; font-size: 11.5px; color: #777; }
      .status.err { background: #ffe0e0; color: #b52d2d; }
      .tip { margin-top: 10px; font-size: 11px; color: #999; line-height: 1.6; }
      code { background: #f0f0f0; padding: 1px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>ReadFlow · 网页阅读助手</h1>
    <p class="sub">在任意网页高亮已存词，划词即可查词收词</p>

    <label for="server">ReadFlow 服务地址</label>
    <input id="server" type="text" placeholder="http://127.0.0.1:3000" />

    <label for="token">插件 Token</label>
    <input id="token" type="password" placeholder="在 ReadFlow 设置页生成" />

    <label for="lang">页面语言</label>
    <select id="lang">
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
    </select>

    <div class="row">
      <span>启用网页高亮</span>
      <button id="enabled" class="switch" aria-label="启用高亮"></button>
    </div>

    <button id="save" class="act">保存并同步</button>
    <button id="sync" class="act ghost">仅重新同步词表</button>

    <div id="status" class="status">读取中…</div>
    <p class="tip">
      Token 获取：打开 ReadFlow → 右上角头像 → <b>设置</b> → 浏览器插件 → 生成/复制。<br />
      插件安装：Chrome → <code>chrome://extensions</code> → 开发者模式 → 加载已解压的扩展程序 → 选项目的 <code>extension/</code> 目录。
    </p>

    <script src="popup.js"></script>
  </body>
</html>
